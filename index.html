/* =========================================================
   SOM (CORRIGIDO PARA DESBLOQUEIO DE AUDIO CONTEXT)
========================================================= */
class SoundFX {
    constructor() {
        this.enabled = true;
        this.ctx = null;
        this.lastMoveSound = 0;
    }
    init() {
        if (!this.enabled) return;
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    }
    tone(type, start, end, duration, volume = .08) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const oscillator = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(start, now);
            if (start !== end) {
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, end), now + duration);
            }
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(.001, now + duration);
            oscillator.connect(gain);
            gain.connect(this.ctx.destination);
            oscillator.start(now);
            oscillator.stop(now + duration);
        } catch(e) {}
    }
    pellet() { this.tone('square', 620, 920, .055, .055); }
    power() { this.tone('square', 300, 900, .18, .10); }
    move() {
        const now = performance.now();
        if (now - this.lastMoveSound < 85) return;
        this.lastMoveSound = now;
        this.tone('triangle', 90, 130, .025, .018);
    }
    ghost() { this.tone('sawtooth', 220, 800, .22, .11); }
    death() { this.tone('sawtooth', 420, 60, .55, .14); }
    win() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [350, 500, 650, 850, 1050];
        notes.forEach((frequency, index) => {
            const start = now + index * .09;
            const oscillator = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(frequency, start);
            gain.gain.setValueAtTime(.09, start);
            gain.gain.exponentialRampToValueAtTime(.001, start + .08);
            oscillator.connect(gain);
            gain.connect(this.ctx.destination);
            oscillator.start(start);
            oscillator.stop(start + .08);
        });
    }
}

    pelletsLeft = 0;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (map[r][c] === 0 || map[r][c] === 3) {
                pelletsLeft++;
            }
        }
    }
}

function resetPositions() {
    pacman.x = 9 * TILE + TILE / 2;
    pacman.y = 16 * TILE + TILE / 2;
    pacman.dir = { ...DIR.NONE };
    pacman.nextDir = { ...DIR.NONE };
    pacman.moveSoundCounter = 0;
    createGhosts();
}

function initGame() {
    score = 0;
    lives = 3;
    level = 1;
    powerTimer = 0;
    resetMapConfig();
    resetPositions();
    updateUI();
}

function updateUI() {
    scoreDisplay.innerText = score;
    highScoreDisplay.innerText = highScore;
    levelDisplay.innerText = level;
    pelletsDisplay.innerText = pelletsLeft;
    livesDisplay.innerHTML = '';
    for (let i = 0; i < lives; i++) {
        const life = document.createElement('div');
        life.className = 'w-2.5 h-2.5 rounded bg-cyan-400 shadow-sm shadow-cyan-500/50';
        livesDisplay.appendChild(life);
    }
}

/* =========================================================
   GRID UTILS
========================================================= */
function tileCenter(c, r) {
    return { x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 };
}

function getTile(x, y) {
    return { c: Math.floor(x / TILE), r: Math.floor(y / TILE) };
}

function validTile(r, c) {
    return r >= 0 && r < rows && c >= 0 && c < cols;
}

function isWall(r, c) {
    if (!validTile(r, c)) return true;
    return map[r][c] === 1;
}

function canGoFromTile(c, r, dir) {
    if (dir.x === 0 && dir.y === 0) return false;
    return !isWall(r + dir.y, c + dir.x);
}

function oppositeDirection(a, b) {
    return a.x === -b.x && a.y === -b.y;
}

function canMoveTo(x, y, radius) {
    const left = Math.floor((x - radius) / TILE);
    const right = Math.floor((x + radius) / TILE);
    const top = Math.floor((y - radius) / TILE);
    const bottom = Math.floor((y + radius) / TILE);

    for (let r = top; r <= bottom; r++) {
        for (let c = left; c <= right; c++) {
            if (isWall(r, c)) return false;
        }
    }
    return true;
}

/* =========================================================
   CONTROLES PAC-MAN
========================================================= */
function setDirection(x, y) {
    soundFX.init();
    pacman.nextDir = { x, y };

    if (oppositeDirection(pacman.nextDir, pacman.dir)) {
        pacman.dir = { ...pacman.nextDir };
        return;
    }

    if (pacman.dir.x === 0 && pacman.dir.y === 0) {
        const tile = getTile(pacman.x, pacman.y);
        if (validTile(tile.r, tile.c) && canGoFromTile(tile.c, tile.r, pacman.nextDir)) {
            pacman.dir = { ...pacman.nextDir };
        }
    }
}

function collectPellet() {
    const tile = getTile(pacman.x, pacman.y);
    if (!validTile(tile.r, tile.c)) return;
    const value = map[tile.r][tile.c];

    if (value === 0) {
        map[tile.r][tile.c] = 2;
        pelletsLeft--;
        score += 10;
        soundFX.pellet();
        updateHighScore();
        updateUI();
        checkWin();
    } else if (value === 3) {
        map[tile.r][tile.c] = 2;
        pelletsLeft--;
        score += 50;
        powerTimer = 600;
        ghosts.forEach(ghost => {
            if (ghost.mode !== 'house') {
                ghost.mode = 'scared';
                ghost.dir = { x: -ghost.dir.x, y: -ghost.dir.y };
            }
        });
        soundFX.power();
        updateHighScore();
        updateUI();
        checkWin();
    }
}

function updatePacman(dt) {
    const tile = getTile(pacman.x, pacman.y);
    const center = tileCenter(tile.c, tile.r);
    const speed = pacman.speed * dt;

    if (validTile(tile.r, tile.c)) {
        if (pacman.nextDir.x !== 0 || pacman.nextDir.y !== 0) {
            if (oppositeDirection(pacman.nextDir, pacman.dir)) {
                pacman.dir = { ...pacman.nextDir };
            } else if (canGoFromTile(tile.c, tile.r, pacman.nextDir)) {
                if (pacman.nextDir.x !== 0 && Math.abs(pacman.y - center.y) <= speed * 1.5) {
                    pacman.y = center.y;
                    pacman.dir = { ...pacman.nextDir };
                } else if (pacman.nextDir.y !== 0 && Math.abs(pacman.x - center.x) <= speed * 1.5) {
                    pacman.x = center.x;
                    pacman.dir = { ...pacman.nextDir };
                }
            }
        }
    }

    const nextX = pacman.x + pacman.dir.x * speed;
    const nextY = pacman.y + pacman.dir.y * speed;

    if (canMoveTo(nextX, nextY, pacman.radius - 0.5)) {
        pacman.x = nextX;
        pacman.y = nextY;

        if (pacman.dir.x !== 0 || pacman.dir.y !== 0) {
            pacman.moveSoundCounter += dt;
            if (pacman.moveSoundCounter > 5) {
                soundFX.move();
                pacman.moveSoundCounter = 0;
            }
        }
    } else {
        pacman.dir = { ...DIR.NONE };
    }

    collectPellet();

    pacman.mouth += .045 * pacman.mouthDirection * dt;
    if (pacman.mouth > .45) pacman.mouthDirection = -1;
    if (pacman.mouth < .04) pacman.mouthDirection = 1;

    if (pacman.x < -TILE / 2) pacman.x = WIDTH + TILE / 2;
    else if (pacman.x > WIDTH + TILE / 2) pacman.x = -TILE / 2;
}

/* =========================================================
   IA DOS FANTASMAS
========================================================= */
function getAvailableGhostDirections(ghost, tile) {
    const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
    return dirs.filter(dir => {
        if (oppositeDirection(dir, ghost.dir)) return false;
        return canGoFromTile(tile.c, tile.r, dir);
    });
}

function chooseGhostDirection(ghost) {
    const tile = getTile(ghost.x, ghost.y);
    if (!validTile(tile.r, tile.c)) {
        ghost.dir = { ...DIR.NONE };
        return;
    }

    let available = getAvailableGhostDirections(ghost, tile);
    if (!available.length) {
        available = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT].filter(dir => canGoFromTile(tile.c, tile.r, dir));
    }
    if (!available.length) {
        ghost.dir = { ...DIR.NONE };
        return;
    }

    if (ghost.mode === 'scared') {
        ghost.dir = { ...available[Math.floor(Math.random() * available.length)] };
        return;
    }

    let bestDir = available[0];
    let bestScore = Infinity;

    for (const dir of available) {
        const nextC = tile.c + dir.x;
        const nextR = tile.r + dir.y;
        const center = tileCenter(nextC, nextR);
        let distance = Math.hypot(center.x - pacman.x, center.y - pacman.y);

        if (distance < bestScore) {
            bestScore = distance;
            bestDir = dir;
        }
    }
    ghost.dir = { ...bestDir };
}

function updateGhostHouse(ghost, dt) {
    const house = tileCenter(9, 9);
    const exit = tileCenter(9, 8);

    if (ghost.houseTimer > 0) {
        ghost.houseTimer -= dt;
        ghost.y = house.y + Math.sin(performance.now() * 0.005 + ghost.startX) * 3;
        ghost.dir = { x: 0, y: 0 };
        return;
    }

    const dx = exit.x - ghost.x;
    const dy = exit.y - ghost.y;
    const distance = Math.hypot(dx, dy);
    const speed = 1.5 * dt;

    if (distance > 1) {
        ghost.x += (dx / distance) * speed;
        ghost.y += (dy / distance) * speed;
        return;
    }

    ghost.x = exit.x;
    ghost.y = exit.y;
    ghost.dir = { ...DIR.LEFT };
    ghost.mode = powerTimer > 0 ? 'scared' : 'chase';
}

function updateGhost(ghost, dt) {
    if (ghost.mode === 'house') {
        updateGhostHouse(ghost, dt);
        return;
    }

    const speed = (ghost.mode === 'scared' ? 1.35 : 1.55 + Math.min(level - 1, 5) * 0.05) * dt;
    const tile = getTile(ghost.x, ghost.y);
    const center = tileCenter(tile.c, tile.r);

    if (validTile(tile.r, tile.c)) {
        if (Math.abs(ghost.x - center.x) <= speed && Math.abs(ghost.y - center.y) <= speed) {
            ghost.x = center.x;
            ghost.y = center.y;
            chooseGhostDirection(ghost);
        }
    }

    const nextX = ghost.x + ghost.dir.x * speed;
    const nextY = ghost.y + ghost.dir.y * speed;

    if (canMoveTo(nextX, nextY, 5)) {
        ghost.x = nextX;
        ghost.y = nextY;
    } else {
        ghost.x = center.x;
        ghost.y = center.y;
        chooseGhostDirection(ghost);
    }

    if (ghost.x < -TILE / 2) ghost.x = WIDTH + TILE / 2;
    else if (ghost.x > WIDTH + TILE / 2) ghost.x = -TILE / 2;
}

/* =========================================================
   COLISÕES COM FANTASMAS
========================================================= */
function checkGhostCollision(ghost) {
    if (ghost.mode === 'house') return;

    const distance = Math.hypot(pacman.x - ghost.x, pacman.y - ghost.y);
    if (distance > TILE * .72) return;

    if (ghost.mode === 'scared') {
        score += 200;
        updateHighScore();
        soundFX.ghost();
        ghost.x = ghost.startX * TILE + TILE / 2;
        ghost.y = ghost.startY * TILE + TILE / 2;
        ghost.dir = { ...DIR.UP };
        ghost.mode = 'house';
        ghost.houseTimer = 500;
        updateUI();
        return;
    }

    lives--;
    soundFX.death();
    updateUI();

    if (lives <= 0) {
        gameOver();
        return;
    }

    gameState = 'LIFE_LOST';
    statusDisplay.innerText = 'CONEXÃO PERDIDA';

    setTimeout(() => {
        if (gameState !== 'LIFE_LOST') return;
        resetPositions();
        gameState = 'PLAYING';
        statusDisplay.innerText = 'SISTEMA ONLINE';
    }, 700);
}

/* =========================================================
   UPDATE & DRAW GERAL
========================================================= */
function update(dt) {
    if (gameState !== 'PLAYING') return;

    if (powerTimer > 0) {
        powerTimer -= dt;
        if (powerTimer <= 0) {
            powerTimer = 0;
            ghosts.forEach(ghost => {
                if (ghost.mode === 'scared') ghost.mode = 'chase';
            });
        }
    }

    updatePacman(dt);

    ghosts.forEach(ghost => {
        updateGhost(ghost, dt);
        checkGhostCollision(ghost);
    });

    updateUI();
}

function drawMap() {
    const pulse = .5 + Math.sin(performance.now() * .008) * .5;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const tile = map[r][c];
            const x = c * TILE;
            const y = r * TILE;

            ctx.fillStyle = '#030309';
            ctx.fillRect(x, y, TILE, TILE);

            if (tile === 1) {
                ctx.fillStyle = '#071329';
                ctx.fillRect(x, y, TILE, TILE);
                ctx.strokeStyle = '#00d9ff';
                ctx.lineWidth = 1;
                ctx.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
                ctx.strokeStyle = 'rgba(0,242,254,.25)';
                ctx.beginPath();
                ctx.arc(x + TILE / 2, y + TILE / 2, 2, 0, Math.PI * 2);
                ctx.stroke();
            }
            if (tile === 0) {
                ctx.beginPath();
                ctx.arc(x + TILE / 2, y + TILE / 2, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 5;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            if (tile === 3) {
                ctx.beginPath();
                ctx.arc(x + TILE / 2, y + TILE / 2, 4 + pulse * 2, 0, Math.PI * 2);
                ctx.fillStyle = '#00f2fe';
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 8 + pulse * 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            if (tile === 4) {
                ctx.strokeStyle = 'rgba(0,242,254,.35)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
            }
        }
    }
}

function drawPacman() {
    ctx.save();
    ctx.translate(pacman.x, pacman.y);
    let angle = 0;
    if (pacman.dir.x > 0) angle = 0;
    else if (pacman.dir.x < 0) angle = Math.PI;
    else if (pacman.dir.y > 0) angle = Math.PI / 2;
    else if (pacman.dir.y < 0) angle = -Math.PI / 2;

    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, pacman.radius, pacman.mouth, Math.PI * 2 - pacman.mouth);
    ctx.closePath();
    ctx.fillStyle = '#00f2fe';
    ctx.shadowColor = '#00f2fe';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
}

function drawGhost(ghost) {
    ctx.save();
    ctx.translate(ghost.x, ghost.y);
    let color = ghost.color;

    if (ghost.mode === 'scared') {
        const blinking = powerTimer < 180 && Math.floor(powerTimer / 12) % 2 === 0;
        color = blinking ? '#ffffff' : '#1e40af';
    }

    const radius = 8;
    ctx.beginPath();
    ctx.arc(0, -2, radius, Math.PI, 0);
    ctx.lineTo(radius, radius);
    ctx.lineTo(radius / 2, radius - 2);
    ctx.lineTo(0, radius);
    ctx.lineTo(-radius / 2, radius - 2);
    ctx.lineTo(-radius, radius);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (ghost.mode !== 'scared') {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-3, -3, 3, 0, Math.PI * 2);
        ctx.arc(3, -3, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#030309';
        ctx.beginPath();
        ctx.arc(-3 + ghost.dir.x * 1.2, -3 + ghost.dir.y * 1.2, 1.3, 0, Math.PI * 2);
        ctx.arc(3 + ghost.dir.x * 1.2, -3 + ghost.dir.y * 1.2, 1.3, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-4, -3); ctx.lineTo(-2, -1); ctx.lineTo(-4, 1);
        ctx.moveTo(4, -3); ctx.lineTo(2, -1); ctx.lineTo(4, 1);
        ctx.stroke();
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#030309';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    drawMap();
    drawPacman();
    ghosts.forEach(ghost => drawGhost(ghost));
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 16.6667;
    lastTime = timestamp;
    dt = Math.min(dt, 2);

    update(dt);
    draw();

    animationFrame = requestAnimationFrame(gameLoop);
}

function startLoop() {
    if (animationFrame === null) {
        lastTime = 0;
        animationFrame = requestAnimationFrame(gameLoop);
    }
}

function showOverlay(title, text, buttonText, showMapPicker = false) {
    overlayTitle.innerText = title;
    overlayText.innerText = text;
    startButton.innerText = buttonText;
    
    const mapPicker = document.getElementById('mapSelectionContainer');
    if (showMapPicker) {
        mapPicker.classList.remove('hidden');
    } else {
        mapPicker.classList.add('hidden');
    }

    messageOverlay.classList.remove('opacity-0', 'pointer-events-none');
    messageOverlay.classList.add('opacity-100', 'pointer-events-auto');
}

function hideOverlay() {
    messageOverlay.classList.remove('opacity-100', 'pointer-events-auto');
    messageOverlay.classList.add('opacity-0', 'pointer-events-none');
}

function checkWin() {
    if (pelletsLeft > 0) return;
    updateHighScore();
    gameState = 'WIN';
    statusDisplay.innerText = 'GRID PURIFICADO';
    soundFX.win();
    showOverlay('SISTEMA LIMPO', `Todos os nodes coletados! Pontuação: ${score}`, 'PRÓXIMO NÍVEL');
}

function nextLevel() {
    level++;
    resetMapConfig();
    powerTimer = 0;
    resetPositions();
    gameState = 'PLAYING';
    statusDisplay.innerText = 'SISTEMA ONLINE';
    updateUI();
    hideOverlay();
    startLoop();
}

function gameOver() {
    gameState = 'GAMEOVER';
    updateHighScore();
    statusDisplay.innerText = 'SISTEMA COMPROMETIDO';
    soundFX.death();
    showOverlay('FALHA DE SEGURANÇA', `Os firewalls capturaram o Pac-Man! Pontuação: ${score}`, 'TENTAR NOVAMENTE', true);
}

function togglePause() {
    if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        statusDisplay.innerText = 'PROCESSO EM ESPERA';
        showOverlay('SISTEMA PAUSADO', 'O processo foi pausado.', 'RETOMAR');
        return;
    }
    if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        statusDisplay.innerText = 'SISTEMA ONLINE';
        hideOverlay();
        startLoop();
    }
}

startButton.addEventListener('click', () => {
    soundFX.init();
    if (gameState === 'WIN') { 
        nextLevel(); 
        return; 
    }
    if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        statusDisplay.innerText = 'SISTEMA ONLINE';
        hideOverlay();
        startLoop();
        return;
    }
    initGame();
    gameState = 'PLAYING';
    statusDisplay.innerText = 'SISTEMA ONLINE';
    hideOverlay();
    startLoop();
});

pauseButton.addEventListener('click', () => {
    soundFX.init();
    togglePause();
});

soundButton.addEventListener('click', () => {
    soundFX.enabled = !soundFX.enabled;
    if (soundFX.enabled) {
        soundFX.init();
        soundButton.innerText = '🔊 Som: ON';
    } else {
        soundButton.innerText = '🔇 Som: OFF';
    }
});

window.addEventListener('keydown', event => {
    const keys = {
        ArrowUp: [0, -1], KeyW: [0, -1],
        ArrowDown: [0, 1], KeyS: [0, 1],
        ArrowLeft: [-1, 0], KeyA: [-1, 0],
        ArrowRight: [1, 0], KeyD: [1, 0]
    };
    if (keys[event.code]) {
        event.preventDefault();
        const [x, y] = keys[event.code];
        setDirection(x, y);
        return;
    }
    if (event.code === 'Escape') {
        event.preventDefault();
        togglePause();
    }
});

function bindControl(id, x, y) {
    const button = document.getElementById(id);
    if (!button) return;
    const handler = event => {
        event.preventDefault();
        soundFX.init();
        setDirection(x, y);
    };
    button.addEventListener('pointerdown', handler);
}

bindControl('btnUp', 0, -1);
bindControl('btnDown', 0, 1);
bindControl('btnLeft', -1, 0);
bindControl('btnRight', 1, 0);

document.addEventListener('visibilitychange', () => {
    if (document.hidden && gameState === 'PLAYING') {
        togglePause();
    }
});

function resizeCanvas() {
    const maxWidth = Math.min(380, window.innerWidth - 28);
    canvas.style.width = `${maxWidth}px`;
    canvas.style.height = `${maxWidth * HEIGHT / WIDTH}px`;
}

window.addEventListener('resize', resizeCanvas);

// Inicialização de exibição
resetMapConfig();
resizeCanvas();
draw();

showOverlay(
    'PAC-MAN TECH',
    'Selecione seu mapa cibernético e inicie o sistema:',
    'INICIALIZAR SISTEMA',
    true
);
</script>

</body>
</html>
